<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<title>Devameer Bot Pipeline</title>
<meta name="description" content="Live Devameer Bot pipeline — a real-time view of the trading workflow.">
<meta property="og:title" content="Devameer Bot Pipeline">
<meta property="og:description" content="Live workflow canvas for Devameer Bot.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Devameer Bot Pipeline">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pipeline.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><ellipse cx='32' cy='36' rx='24' ry='22' fill='%23fff' stroke='%23000' stroke-width='3'/><ellipse cx='28' cy='32' rx='3' ry='6' fill='%23000'/><ellipse cx='40' cy='30' rx='3' ry='6' fill='%23000'/></svg>">
</head>
<body>
<section id="login" class="login hidden">
  <div class="login-card">
    <div class="bean-sm" aria-hidden="true"></div>
    <h1>Devameer Bot Pipeline</h1>
    <div class="badge">LIVE FLOW</div>
    <form id="loginForm">
      <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
      <button class="pill" type="submit">Unlock</button>
    </form>
    <div id="loginErr" class="err"></div>
    <p class="note">Read-only live workflow. Same password as the trading terminal.</p>
  </div>
</section>

<section id="app" class="stage hidden">
  <header class="hud">
    <div class="hud-name">Devameer Bot Pipeline</div>
    <span class="live-dot" id="liveDot" title="Streaming"><i></i>LIVE</span>
    <span class="mode-pill paper" id="modePill">PAPER</span>
  </header>
  <div id="recHud" class="rec-hud">
    <button type="button" class="rec-btn" id="recToggle" aria-label="Record" aria-expanded="false" title="Record">
      <i></i><span>Rec</span>
    </button>
    <div class="rec-livebar hidden" id="recLiveBar">
      <span class="rec-pulse"></span>
      <span id="recTimer">0:00</span>
      <span class="rec-pct hidden" id="recPct">0%</span>
      <button type="button" class="rec-stop" id="recStop">Stop</button>
    </div>
    <div class="rec-progress hidden" id="recProgress" aria-hidden="true"><i id="recProgressBar"></i></div>
    <div class="rec-pop hidden" id="recPop">
      <div class="rec-seg" data-group="mode">
        <button type="button" data-mode="live" class="on">Live</button>
        <button type="button" data-mode="replay">Replay</button>
      </div>
      <div class="rec-replay hidden" id="recReplayOpts">
        <div class="rec-label">Last</div>
        <div class="rec-seg">
          <button type="button" data-mins="1" class="on">1m</button>
          <button type="button" data-mins="5">5m</button>
          <button type="button" data-mins="15">15m</button>
        </div>
        <div class="rec-seg rec-seg-more">
          <button type="button" data-mins="30">30m</button>
          <button type="button" data-mins="60">1h</button>
        </div>
        <div class="rec-label">Speed</div>
        <div class="rec-seg">
          <button type="button" data-speed="1">1x</button>
          <button type="button" data-speed="2">2x</button>
          <button type="button" data-speed="4" class="on">4x</button>
        </div>
      </div>
      <div class="rec-label">Format</div>
      <div class="rec-seg">
        <button type="button" data-aspect="16:9">16:9</button>
        <button type="button" data-aspect="9:16" class="on">9:16</button>
        <button type="button" data-aspect="1:1">1:1</button>
      </div>
      <button type="button" class="rec-start" id="recStart">Start live</button>
      <div class="rec-status" id="recStatus"></div>
    </div>
  </div>
  <div id="wrap" class="wrap"><canvas id="cv"></canvas></div>
  <div id="tip" class="tip hidden"></div>
</section>
<script src="/pipeline.js"></script>
<script src="/record.js"></script>
<script src="/site.js"></script>
</body>
</html>
