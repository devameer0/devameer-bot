<!doctype html>
<html lang="en" data-theme="dark" class="flow-standalone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<title>Devameer Bot Pipeline</title>
<meta name="description" content="Live Devameer Bot pipeline — PumpPortal to exits, in real time.">
<meta property="og:title" content="Devameer Bot Pipeline">
<meta property="og:description" content="Live n8n-style view of the Devameer Bot trading pipeline.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Devameer Bot Pipeline">
<script>!function(){try{var t=localStorage.getItem('devameer-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');if(t==='light')document.querySelector('meta[name="theme-color"]').setAttribute('content','#F9FAFB')}catch(e){document.documentElement.setAttribute('data-theme','dark')}}()</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/flow.css">
<link rel="stylesheet" href="/site.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><ellipse cx='32' cy='36' rx='24' ry='22' fill='%23fff' stroke='%23000' stroke-width='3'/><ellipse cx='28' cy='32' rx='3' ry='6' fill='%23000'/><ellipse cx='40' cy='30' rx='3' ry='6' fill='%23000'/></svg>">
</head>
<body>
<section id="login" class="login hidden">
  <button type="button" class="theme-btn" data-theme-toggle title="Switch theme" aria-label="Switch theme"><svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 14.3A8.5 8.5 0 1 1 9.7 3 7 7 0 0 0 21 14.3z"/></svg><svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <div class="login-card">
    <div class="bean-sm" aria-hidden="true"></div>
    <h1>Devameer Bot Pipeline</h1>
    <div class="badge">LIVE FLOW</div>
    <form id="loginForm"><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required><button class="pill dark" type="submit">Unlock</button></form>
    <div id="loginErr" class="err"></div>
    <p class="muted sm login-note">Read-only view of the live pipeline. Same password as the trading terminal.</p>
  </div>
</section>

<section id="app" class="flow-tab hidden">
  <div class="flow-app">
    <header class="flow-top">
      <a class="flow-back" id="flowDash" href="https://devameer-bot.onrender.com" title="Open the main dashboard">Dashboard</a>
      <div class="flow-brand">
        <div class="flow-logo" aria-hidden="true"></div>
        <div class="flow-tabs-mini">
          <button type="button" class="on">Pipeline</button>
          <button type="button" id="flowSearchBtn">Log</button>
        </div>
      </div>
      <div class="flow-title">
        <div class="name"><span>Workflow Name:</span> Devameer Bot Pipeline</div>
      </div>
      <div class="flow-status">
        <span class="flow-pill paper" id="flowMode">PAPER</span>
        <button type="button" class="flow-run off" id="flowRun" title="Read-only status" aria-live="polite"><i></i><span>PAUSED</span></button>
        <button type="button" class="theme-btn" data-theme-toggle title="Switch theme" aria-label="Switch theme"><svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 14.3A8.5 8.5 0 1 1 9.7 3 7 7 0 0 0 21 14.3z"/></svg><svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
      <div class="flow-tools">
        <button type="button" id="flowZoomOut" title="Zoom out">−</button>
        <button type="button" id="flowZoomIn" title="Zoom in">+</button>
        <button type="button" class="flow-fit" id="flowFit">Fit view</button>
        <button type="button" class="flow-term-btn" id="flowTermBtn" title="Activity log">⌘</button>
      </div>
    </header>
    <div class="flow-body">
      <aside class="flow-side">
        <button type="button" id="flowLegendBtn" title="Nodes">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="8.5" y="13" width="7" height="7" rx="2"/></svg>
        </button>
        <button type="button" id="flowSearchBtn2" title="Search log">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3-3"/></svg>
        </button>
        <div class="gap"></div>
        <button type="button" id="logoutBtn" title="Log out">
          <svg viewBox="0 0 24 24"><path d="M10 6H6v12h4"/><path d="M14 12H4"/><path d="M16 8l4 4-4 4"/></svg>
        </button>
      </aside>
      <div class="flow-legend" id="flowLegend"></div>
      <div class="flow-canvas-wrap" id="flowCanvasWrap"><canvas id="flowCanvas"></canvas></div>
      <aside class="flow-panel hidden" id="flowPanel">
        <div class="flow-ph">
          <div class="ic" id="flowPIcon"></div>
          <div><div class="nm" id="flowPName"></div><div class="sub" id="flowPSub"></div></div>
          <button type="button" class="x" id="flowPanelX" aria-label="Close">✕</button>
        </div>
        <div class="flow-ptabs">
          <button type="button" class="on" data-ptab="settings">Settings</button>
          <button type="button" data-ptab="params">Parameters</button>
        </div>
        <div class="flow-pbody">
          <div id="flowPConfigWrap">
            <div class="muted sm" style="margin-bottom:8px">Read-only node config. Secrets are never shown.</div>
            <div class="flow-kv" id="flowPConfig"></div>
          </div>
          <div id="flowPEventsWrap" class="hidden">
            <input class="flow-filter" id="flowPCoin" placeholder="Filter by coin symbol or mint">
            <pre class="flow-json" id="flowPJson">Select a node.</pre>
          </div>
        </div>
        <div class="flow-pexec"><button type="button" id="flowReveal">Reveal in log</button></div>
      </aside>
    </div>
    <div class="flow-log" id="flowLog">
      <div class="flow-lh">
        <b>Terminal</b>
        <input id="flowQ" type="search" placeholder="Search events">
        <select id="flowType">
          <option value="">All types</option>
          <option>token</option><option>lists</option><option>price</option><option>tick</option>
          <option>candidate</option><option>pass</option><option>reject</option><option>buy</option>
          <option>sell</option><option>exit</option><option>write</option><option>error</option>
          <option>status</option><option>migrate</option><option>withdraw</option><option>replay</option>
        </select>
        <select id="flowAgent">
          <option value="">All agents</option>
          <option value="sniper">Sniper</option>
          <option value="scout">Scout</option>
          <option value="curve">Curve</option>
          <option value="graduate">Graduate</option>
        </select>
        <input id="flowCoin" type="search" placeholder="Coin" style="width:90px">
        <label><input type="checkbox" id="flowErrs"> Errors only</label>
        <span class="grow"></span>
        <button type="button" id="flowPause">Pause</button>
        <button type="button" id="flowCsv">CSV</button>
        <button type="button" id="flowJson">JSON</button>
      </div>
      <div class="flow-lines" id="flowLines"></div>
    </div>
  </div>
</section>
<script>window.DEVAMEER_FLOW_OPTS={standalone:true,dashboardUrl:"https://devameer-bot.onrender.com"};</script>
<script src="/flow.js"></script>
<script src="/site.js"></script>
</body>
</html>
