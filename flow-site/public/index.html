<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<title>Devameer Bot Pipeline</title>
<meta name="description" content="Live Devameer Bot pipeline — a real-time view of the trading workflow.">
<meta property="og:title" content="Devameer Bot Pipeline">
<meta property="og:description" content="Live workflow canvas for Devameer Bot.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Devameer Bot Pipeline">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pipeline.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><ellipse cx='32' cy='36' rx='24' ry='22' fill='%23fff' stroke='%23000' stroke-width='3'/><ellipse cx='28' cy='32' rx='3' ry='6' fill='%23000'/><ellipse cx='40' cy='30' rx='3' ry='6' fill='%23000'/></svg>">
</head>
<body>
<section id="login" class="login hidden">
  <div class="login-card">
    <div class="bean-sm" aria-hidden="true"></div>
    <h1>Devameer Bot Pipeline</h1>
    <div class="badge">LIVE FLOW</div>
    <form id="loginForm">
      <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
      <button class="pill" type="submit">Unlock</button>
    </form>
    <div id="loginErr" class="err"></div>
    <p class="note">Read-only live workflow. Same password as the trading terminal.</p>
  </div>
</section>

<section id="app" class="stage hidden">
  <header class="hud">
    <div class="hud-name">Devameer Bot Pipeline</div>
    <span class="live-dot" id="liveDot" title="Streaming"><i></i>LIVE</span>
    <span class="mode-pill paper" id="modePill">PAPER</span>
  </header>
  <div id="wrap" class="wrap"><canvas id="cv"></canvas></div>
  <div id="tip" class="tip hidden"></div>
</section>
<script src="/pipeline.js"></script>
<script src="/site.js"></script>
</body>
</html>
